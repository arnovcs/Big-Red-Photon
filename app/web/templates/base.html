<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  {% block head %}{% endblock %}
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen bg-yellow-50 text-slate-900 antialiased">
  <header class="border-b border-yellow-400 bg-yellow-300">
    <div class="mx-auto flex max-w-{% block width %}md{% endblock %} items-center gap-2 px-4 py-4">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-slate-900 text-sm font-bold text-yellow-300" aria-hidden="true">{{ app_name[:1] }}</span>
      <span class="text-lg font-semibold">{{ app_name }}</span>
    </div>
  </header>
  <main class="mx-auto max-w-{{ self.width() }} px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
